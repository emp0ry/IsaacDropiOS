name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isaac-fixes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install packaging tools
        shell: bash
        run: |
          set -euo pipefail
          command -v dpkg-deb >/dev/null 2>&1 || brew install dpkg
          command -v rg >/dev/null 2>&1 || brew install ripgrep

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^Version:/ { print $2 }' package/control)"
          test -n "$version"
          grep -q "^## ${version}$" CHANGELOG.md
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test and build every distribution
        run: make release

      - name: Verify release contents and signatures
        shell: bash
        run: |
          set -euo pipefail
          for file in IsaacFixes.dylib IsaacFixes-PlayCover.dylib IsaacFixes-rootless.deb \
            IsaacFixes-LiveContainer.framework.zip IsaacFixes-Embedded.zip SHA256SUMS; do
            test -s "dist/$file"
          done
          (cd dist && shasum -a 256 -c SHA256SUMS)
          codesign --verify --strict build/IsaacFixes.framework
          codesign --verify --strict dist/IsaacFixes-PlayCover.dylib
          xcrun vtool -show-build dist/IsaacFixes-PlayCover.dylib | grep -q 'platform MACCATALYST'
          unzip -l dist/IsaacFixes-Embedded.zip
          unzip -l dist/IsaacFixes-LiveContainer.framework.zip

      - name: Upload verified build
        uses: actions/upload-artifact@v6
        with:
          name: IsaacFixes-v${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          awk -v version="$VERSION" '$0 == "## " version { capture=1; next } /^## / && capture { exit } capture { print }' CHANGELOG.md > build/release-notes.md
          gh release create "v${VERSION}" --verify-tag --target "$GITHUB_SHA" \
            --title "Isaac Fixes v${VERSION}" \
            --notes-file build/release-notes.md --latest \
            dist/IsaacFixes.dylib dist/IsaacFixes-PlayCover.dylib dist/IsaacFixes-rootless.deb \
            dist/IsaacFixes-LiveContainer.framework.zip \
            dist/IsaacFixes-Embedded.zip dist/SHA256SUMS
